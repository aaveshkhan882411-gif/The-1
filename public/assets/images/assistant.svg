<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="GrowthAI Assistant">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="44" fill="url(#coreGlow)" />

  <!-- Neural Intelligence Core Symbol -->
  <g transform="translate(16, 16)">
    <!-- Outer Orbital Rings -->
    <circle cx="48" cy="48" r="34" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="48" cy="48" r="28" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.25" />

    <!-- Hexagonal Intelligence Frame -->
    <path d="M 48 16 L 76 32 L 76 64 L 48 80 L 20 64 L 20 32 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Neural Connection Lines -->
    <path d="M 48 16 L 48 48 M 76 32 L 48 48 M 20 32 L 48 48 M 76 64 L 48 48 M 20 64 L 48 48 M 48 80 L 48 48" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Neural Nodes -->
    <circle cx="48" cy="16" r="4" fill="#60A5FA" />
    <circle cx="76" cy="32" r="3.5" fill="#3B82F6" />
    <circle cx="76" cy="64" r="3.5" fill="#3B82F6" />
    <circle cx="48" cy="80" r="4" fill="#60A5FA" />
    <circle cx="20" cy="64" r="3.5" fill="#3B82F6" />
    <circle cx="20" cy="32" r="3.5" fill="#3B82F6" />

    <!-- Central Supercore -->
    <circle cx="48" cy="48" r="8" fill="#FFFFFF" />
    <circle cx="48" cy="48" r="13" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.8" />
  </g>
</svg>
