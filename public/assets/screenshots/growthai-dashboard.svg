      <!-- Card 4: Estimated ROI -->
      <g transform="translate(876, 0)">
        <rect width="272" height="110" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1" />
        <text x="20" y="32" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Generated Pipeline Value</text>
        <text x="20" y="68" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">$142,500</text>
        <rect x="20" y="78" width="65" height="20" rx="10" fill="#10B981" fill-opacity="0.15" />
        <text x="28" y="93" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">↑ 14.2x ROI</text>
      </g>
    </g>

