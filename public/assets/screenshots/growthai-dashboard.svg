        <text x="24" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Real-time throughput across all 13 AI agents</text>

        <!-- Chart Grid Lines -->
        <line x1="24" y1="100" x2="696" y2="100" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
        <line x1="24" y1="160" x2="696" y2="160" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
        <line x1="24" y1="220" x2="696" y2="220" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
        <line x1="24" y1="280" x2="696" y2="280" stroke="#1E293B" stroke-width="1" />

        <!-- Area Chart Gradient Fill -->
        <path d="M 24 240 Q 140 180 260 210 T 500 120 T 696 80 L 696 280 L 24 280 Z" fill="url(#chartGrad)" />
        
        <!-- Smooth Trend Line -->
        <path d="M 24 240 Q 140 180 260 210 T 500 120 T 696 80" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />

        <!-- Data Point Highlights -->
        <circle cx="260" cy="210" r="5" fill="#60A5FA" />
        <circle cx="500" cy="120" r="5" fill="#60A5FA" />
        <circle cx="696" cy="80" r="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" />

        <!-- X-Axis Labels -->
        <g transform="translate(0, 310)" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
          <text x="24">00:00</text>
          <text x="140">04:00</text>
          <text x="260">08:00</text>
          <text x="380">12:00</text>
          <text x="500">16:00</text>
          <text x="620">20:00</text>
          <text x="696">23:59</text>
        </g>
      </g>

      <!-- Right: AI Workforce Status Grid (Width: 428px) -->
      <g transform="translate(748, 0)">
        <rect width="400" height="340" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1" />
        <text x="24" y="32" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Autonomous AI Workforce</text>
        <text x="24" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Key specialized operational agents</text>

        <!-- Agent List Items -->
        <g transform="translate(24, 75)">
          <!-- Agent 1: AI CEO -->
          <rect width="352" height="48" rx="8" fill="#080C14" stroke="#1E293B" stroke-width="1" />
          <circle cx="24" cy="24" r="6" fill="#10B981" />
          <text x="44" y="21" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">AI CEO</text>
          <text x="44" y="37" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Strategic coordination &amp; analytics</text>
          <text x="325" y="28" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Active</text>

          <!-- Agent 2: AI Sales -->
          <g transform="translate(0, 58)">
            <rect width="352" height="48" rx="8" fill="#080C14" stroke="#1E293B" stroke-width="1" />
            <circle cx="24" cy="24" r="6" fill="#10B981" />
            <text x="44" y="21" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">AI Sales</text>
            <text x="44" y="37" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Pipeline management &amp; closing</text>
            <text x="325" y="28" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Active</text>
          </g>

          <!-- Agent 3: AI Voice & WhatsApp -->
          <g transform="translate(0, 116)">
            <rect width="352" height="48" rx="8" fill="#080C14" stroke="#1E293B" stroke-width="1" />
            <circle cx="24" cy="24" r="6" fill="#10B981" />
            <text x="44" y="21" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">AI Voice &amp; WhatsApp</text>
            <text x="44" y="37" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Real-time multi-channel engagement</text>
            <text x="325" y="28" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Active</text>
          </g>

          <!-- Agent 4: AI Support & Follow-up -->
          <g transform="translate(0, 174)">
            <rect width="352" height="48" rx="8" fill="#080C14" stroke="#1E293B" stroke-width="1" />
            <circle cx="24" cy="24" r="6" fill="#10B981" />
            <text x="44" y="21" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">AI Support &amp; Follow-up</text>
            <text x="44" y="37" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Automated resolution &amp; re-engagement</text>
            <text x="325" y="28" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Active</text>
          </g>
        </g>
      </g>
    </g>

    <!-- ================= BOTTOM SECTION: RECENT AGENT ACTIVITY ================= -->
    <g transform="translate(32, 595)">
      <rect width="1116" height="235" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1" />
      <text x="24" y="32" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Recent Multi-Agent Activity &amp; Web Intelligence Audit</text>
      <text x="24" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Live event stream across connected customer touchpoints</text>

      <!-- Activity Items Table -->
      <g transform="translate(24, 75)" font-family="-apple-system, sans-serif" font-size="13">
        <!-- Header -->
        <text x="0" y="0" fill="#64748B" font-size="11" font-weight="600">AGENT</text>
        <text x="200" y="0" fill="#64748B" font-size="11" font-weight="600">EVENT DESCRIPTION</text>
        <text x="750" y="0" fill="#64748B" font-size="11" font-weight="600">CHANNEL</text>
        <text x="920" y="0" fill="#64748B" font-size="11" font-weight="600">TIMESTAMP</text>
        <line x1="0" y1="12" x2="1068" y2="12" stroke="#1E293B" stroke-width="1" />

        <!-- Row 1 -->
        <g transform="translate(0, 32)">
          <circle cx="6" cy="6" r="4" fill="#3B82F6" />
          <text x="20" y="10" fill="#FFFFFF" font-weight="500">AI Sales Agent</text>
          <text x="200" y="10" fill="#94A3B8">Successfully qualified and closed inbound lead #8492 (Enterprise Plan)</text>
          <text x="750" y="10" fill="#60A5FA">WhatsApp API</text>
          <text x="920" y="10" fill="#64748B">2 mins ago</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 72)">
          <circle cx="6" cy="6" r="4" fill="#10B981" />
          <text x="20" y="10" fill="#FFFFFF" font-weight="500">AI Appointment Agent</text>
          <text x="200" y="10" fill="#94A3B8">Booked strategy demo call with apex-client@enterprise.org</text>
          <text x="750" y="10" fill="#34D399">Google Calendar</text>
          <text x="920" y="10" fill="#64748B">7 mins ago</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(0, 112)">
          <circle cx="6" cy="6" r="4" fill="#F59E0B" />
          <text x="20" y="10" fill="#FFFFFF" font-weight="500">AI Review Manager</text>
          <text x="200" y="10" fill="#94A3B8">Detected 5-star Google review; auto-generated appreciation response</text>
          <text x="750" y="10" fill="#FBBF24">GBP Business Profile</text>
          <text x="920" y="10" fill="#64748B">14 mins ago</text>
        </g>
      </g>
