<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" role="img" aria-label="GrowthAI Dashboard Preview">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090F" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Window Frame / Base Background -->
  <rect width="1440" height="900" fill="url(#dbBg)" />

  <!-- Top System Window Header -->
  <rect width="1440" height="40" fill="#04060A" stroke="#1E293B" stroke-width="1" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" />
  <circle cx="40" cy="20" r="6" fill="#F59E0B" />
  <circle cx="60" cy="20" r="6" fill="#10B981" />
  <text x="720" y="25" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">GrowthAI Enterprise Control Center — Live Production Workspace</text>

  <!-- ================= SIDEBAR NAVIGATION (Width: 260px) ================= -->
  <rect x="0" y="40" width="260" height="860" fill="#080C14" stroke="#1E293B" stroke-width="1" />
  
  <!-- Logo Area -->
  <g transform="translate(24, 70)">
    <rect width="32" height="32" rx="8" fill="#0B0F19" stroke="#3B82F6" stroke-width="1.5" />
    <path d="M 8 22 L 14 14 L 18 17 L 24 9" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="44" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3">Growth<tspan fill="#3B82F6">AI</tspan></text>
  </g>

  <!-- Navigation Links -->
  <g transform="translate(16, 140)" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
    <!-- Active Link: Dashboard -->
    <rect x="0" y="0" width="228" height="40" rx="8" fill="#1D4ED8" fill-opacity="0.2" />
    <path d="M 16 13 h 5 v 5 h -5 z M 16 6 h 5 v 5 h -5 z M 9 13 h 5 v 5 h -5 z M 9 6 h 5 v 5 h -5 z" fill="#60A5FA" />
    <text x="44" y="25" fill="#FFFFFF" font-weight="600">Dashboard</text>

    <!-- Other Links -->
    <g transform="translate(0, 50)" fill="#94A3B8">
      <circle cx="18" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="2" />
      <text x="44" y="20">AI Workforce (13)</text>
    </g>
    <g transform="translate(0, 100)">
      <path d="M 14 10 h 8 M 14 14 h 6 M 10 6 h 4 v 12 h -4 z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <text x="44" y="20">Leads &amp; CRM</text>
    </g>
    <g transform="translate(0, 150)">
      <rect x="12" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
      <text x="44" y="20">Appointments</text>
    </g>
    <g transform="translate(0, 200)">
      <path d="M 12 14 l 4 -4 l 3 3 l 5 -6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <text x="44" y="20">Workflows &amp; Logic</text>
    </g>
    <g transform="translate(0, 250)">
      <path d="M 10 10 h 8 v 6 h -8 z M 14 6 v 4" fill="none" stroke="currentColor" stroke-width="2" />
      <text x="44" y="20">Website Intelligence</text>
    </g>
    <g transform="translate(0, 300)">
      <circle cx="18" cy="14" r="5" fill="none" stroke="currentColor" stroke-width="2" />
      <text x="44" y="20">API &amp; Integrations</text>
    </g>
    <g transform="translate(0, 350)">
      <rect x="10" y="8" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
      <text x="44" y="20">Billing ($2,999/mo)</text>
    </g>
    <g transform="translate(0, 400)">
      <path d="M 12 8 h 6 M 12 12 h 4 M 14 4 v 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <text x="44" y="20">Settings &amp; Security</text>
    </g>
  </g>

  <!-- Workspace Organization Footer in Sidebar -->
  <g transform="translate(24, 820)">
    <rect width="212" height="50" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="25" cy="25" r="15" fill="#2563EB" />
    <text x="25" y="30" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AK</text>
    <text x="52" y="22" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Apex Corp</text>
    <text x="52" y="38" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11">● Enterprise Active</text>
  </g>

  <!-- ================= MAIN CONTENT AREA ================= -->
  <g transform="translate(260, 40)">
    <!-- Top Header Bar -->
    <rect width="1180" height="70" fill="#06090F" stroke="#1E293B" stroke-width="1" />
    <text x="32" y="42" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Executive AI Command Dashboard</text>
    <text x="32" y="60" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">13 Specialized Autonomous Agents Deployed &amp; Operating in Real-Time</text>

    <!-- Search & Quick Profile Actions -->
    <g transform="translate(850, 18)">
      <rect width="200" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="17" r="6" fill="none" stroke="#64748B" stroke-width="1.5" />
      <line x1="24" y1="21" x2="30" y2="27" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
      <text x="38" y="22" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">Search leads, agents...</text>
    </g>

    <!-- ================= METRIC CARDS ROW ================= -->
    <g transform="translate(32, 105)">
      <!-- Card 1: Total Leads Captured -->
      <g transform="translate(0, 0)">
        <rect width="268" height="110" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1" />
        <text x="20" y="32" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Total Leads Captured (24h)</text>
        <text x="20" y="68" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">1,482</text>
        <rect x="20" y="78" width="65" height="20" rx="10" fill="#10B981" fill-opacity="0.15" />
        <text x="28" y="93" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">↑ +18.4%</text>
        <text x="100" y="93" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">vs yesterday</text>
      </g>

      <!-- Card 2: AI Conversion Rate -->
      <g transform="translate(292, 0)">
        <rect width="268" height="110" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1" />
        <text x="20" y="32" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">AI Conversion Rate</text>
        <text x="20" y="68" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">34.8%</text>
        <rect x="20" y="78" width="65" height="20" rx="10" fill="#2563EB" fill-opacity="0.2" />
        <text x="28" y="93" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">↑ +5.2%</text>
        <text x="100" y="93" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">optimized</text>
      </g>

      <!-- Card 3: Active AI Agents -->
      <g transform="translate(584, 0)">
        <rect width="268" height="110" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1" />
        <text x="20" y="32" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Active Workforce Status</text>
        <text x="20" y="68" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">13 / 13</text>
        <rect x="20" y="78" width="75" height="20" rx="10" fill="#10B981" fill-opacity="0.15" />
        <text x="28" y="93" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">● 100% Uptime</text>
